name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER="$(find . -type f -name gradlew -not -path './.git/*' -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "Gradle wrapper not found. Generating it with Gradle..."
            gradle wrapper --gradle-version 8.13
            WRAPPER="$(find . -type f -name gradlew -not -path './.git/*' -print -quit)"
          fi

          if [ -z "$WRAPPER" ]; then
            echo "Could not find or generate gradlew."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"
          echo "Using Gradle wrapper: $WRAPPER"

          chmod +x "$WRAPPER"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

          APK="$(find . -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "Build completed, but no debug APK was found."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apk-output/*.apk
          if-no-files-found: error
